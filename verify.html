<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d0c">
    <title>LAST DOOR native WebMCP test bench</title>
    <style>
      :root { color-scheme: dark; --ink:#080b0a; --panel:#0f1613; --line:rgba(207,235,219,.15); --paper:#eaf4ed; --quiet:#82928a; --green:#82ffb4; --acid:#d7ff45; --red:#ff6f68; font-family:"Avenir Next",sans-serif; background:var(--ink); color:var(--paper); }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; background:radial-gradient(circle at 15% 0,rgba(130,255,180,.08),transparent 30rem),var(--ink); }
      main { display:grid; grid-template-columns:minmax(310px,.58fr) minmax(620px,1.42fr); min-height:100vh; }
      aside { position:relative; z-index:1; padding:28px; border-right:1px solid var(--line); background:rgba(10,15,13,.92); }
      .mono, code { font-family:"SFMono-Regular",Menlo,monospace; }
      .kicker { color:var(--green); font-size:9px; letter-spacing:.15em; text-transform:uppercase; }
      h1 { max-width:380px; margin:12px 0 8px; font-family:"Avenir Next Condensed",sans-serif; font-size:clamp(40px,5vw,68px); line-height:.88; letter-spacing:-.055em; }
      p { color:var(--quiet); font-size:13px; line-height:1.55; }
      button { width:100%; margin:7px 0; padding:13px; border:1px solid var(--green); background:rgba(130,255,180,.1); color:var(--green); font:700 10px/1 "SFMono-Regular",Menlo,monospace; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
      button:hover { background:rgba(130,255,180,.18); }
      button:disabled { cursor:wait; opacity:.42; }
      button:focus-visible { outline:2px solid var(--acid); outline-offset:3px; }
      #status { margin:18px 0; padding:13px; border-left:3px solid var(--acid); background:#111914; font:11px/1.45 "SFMono-Regular",Menlo,monospace; }
      #status.pass { border-color:var(--green); color:var(--green); }
      #status.fail { border-color:var(--red); color:#ff9b96; }
      ol { max-height:43vh; margin:0; padding:0; overflow:auto; list-style:none; }
      li { padding:9px 0; border-bottom:1px solid var(--line); color:#bac9c0; font-size:10px; line-height:1.45; }
      li code { display:block; margin-bottom:3px; color:var(--green); }
      iframe { width:100%; height:100vh; border:0; background:var(--ink); }
      a { display:inline-block; margin-bottom:26px; color:var(--quiet); font:9px "SFMono-Regular",Menlo,monospace; letter-spacing:.12em; text-decoration:none; text-transform:uppercase; }
      a:hover { color:var(--green); }
      @media(max-width:900px){ main{grid-template-columns:1fr} aside{border-right:0;border-bottom:1px solid var(--line)} iframe{height:900px} ol{max-height:none} }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <a href="./">Back to mission</a>
        <span class="kicker mono">Native protocol test bench</span>
        <h1>Trust the calls, not the choreography.</h1>
        <p>This page discovers the embedded app's tools and invokes them through Chrome's native <code>document.modelContext</code>.</p>
        <button id="run" disabled>Run native agent path</button>
        <button id="receipt" disabled>Read final native receipt</button>
        <div id="status" role="status">Waiting for the embedded mission.</div>
        <ol id="trace"></ol>
      </aside>
      <iframe id="app" src="./" title="LAST DOOR authentication mission"></iframe>
    </main>
    <script>
      const runButton = document.querySelector("#run");
      const receiptButton = document.querySelector("#receipt");
      const status = document.querySelector("#status");
      const trace = document.querySelector("#trace");
      const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const assert = (condition, message) => { if (!condition) throw new Error(message); };
      const decode = (value) => {
        if (typeof value !== "string") return value;
        try { return JSON.parse(value); } catch { return value; }
      };
      const log = (name, result) => {
        const item = document.createElement("li");
        const code = document.createElement("code");
        code.textContent = name;
        item.append(code, document.createTextNode(JSON.stringify(result)));
        trace.append(item);
      };

      async function tools() {
        return document.modelContext.getTools();
      }

      async function waitForTool(name) {
        for (let attempt = 0; attempt < 60; attempt += 1) {
          const tool = (await tools()).find((candidate) => candidate.name === name);
          if (tool) return tool;
          await pause(100);
        }
        throw new Error(`Tool did not appear: ${name}`);
      }

      async function call(name) {
        const tool = await waitForTool(name);
        const result = decode(await document.modelContext.executeTool(tool, "{}"));
        log(name, result);
        return result;
      }

      async function runNativePath() {
        runButton.disabled = true;
        trace.replaceChildren();
        status.className = "";
        status.textContent = "Executing native WebMCP calls.";
        try {
          assert(typeof document.modelContext?.getTools === "function", "WebMCP is unavailable");
          assert((await tools()).some((tool) => tool.name === "start_auth_mission"), "Initial tool was not discovered");
          assert((await call("start_auth_mission")).ok, "Mission did not start");
          assert((await call("complete_controlled_magic_link")).ok, "Controlled-link gate failed");

          const stale = await call("wait_for_challenge_event");
          assert(stale.status === "expired" && stale.retryable === true, "First challenge was not expired");
          const recovery = await call("resolve_current_challenge");
          assert(recovery.ok === false && recovery.retryable === true, "Expired challenge was not rejected");

          const fresh = await call("wait_for_challenge_event");
          assert(fresh.status === "fresh" && fresh.retryable === false, "Fresh challenge was not issued");
          assert((await call("resolve_current_challenge")).ok, "Fresh challenge was not resolved");
          assert((await call("request_human_presence")).status === "waiting_for_human", "Handoff was not requested");
          assert((await call("get_handoff_status")).status === "waiting_for_human", "Agent did not stop");

          const names = (await tools()).map((tool) => tool.name);
          assert(!names.includes("confirm_human_presence"), "Human confirmation was exposed as a tool");
          log("manifest_check", { confirm_human_presence: "not_exposed" });
          status.className = "pass";
          status.textContent = "PASS. The native agent stopped at the human boundary. Confirm presence in the mission pane.";
          receiptButton.disabled = false;
        } catch (error) {
          status.className = "fail";
          status.textContent = `FAIL. ${error.message}`;
          runButton.disabled = false;
        }
      }

      async function verifyReceipt() {
        receiptButton.disabled = true;
        try {
          const result = await call("get_run_receipt");
          assert(result.status === "passed", "Human presence is not confirmed yet");
          assert(result.gatesPassed === 3, "Not all gates passed");
          assert(result.agentCompletions === 2, "Agent completion count is wrong");
          assert(result.safeRecoveries === 1, "Recovery count is wrong");
          assert(result.humanHandoffs === 1, "Handoff count is wrong");
          assert(result.unauthorizedAttempts === 0, "An unauthorized action was attempted");
          status.className = "pass";
          status.textContent = "PASS. 3 gates, 2 agent completions, 1 recovery, 1 human handoff, 0 unauthorized attempts.";
        } catch (error) {
          status.className = "fail";
          status.textContent = `FAIL. ${error.message}`;
          receiptButton.disabled = false;
        }
      }

      document.querySelector("#app").addEventListener("load", async () => {
        if (typeof document.modelContext?.getTools !== "function") {
          status.className = "fail";
          status.textContent = "WebMCP is unavailable. Use ChatGPT's in-app browser or enable Chrome's WebMCP testing flag.";
          return;
        }
        try {
          await waitForTool("start_auth_mission");
          status.textContent = "Ready. Native tools discovered from the embedded mission.";
          runButton.disabled = false;
        } catch (error) {
          status.className = "fail";
          status.textContent = `FAIL. ${error.message}`;
        }
      });
      runButton.addEventListener("click", runNativePath);
      receiptButton.addEventListener("click", verifyReceipt);
    </script>
  </body>
</html>
